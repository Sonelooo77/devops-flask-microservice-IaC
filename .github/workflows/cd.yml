name: CD Pipeline | Ephemeral deployment & Smoke test

on:
    push:
        branches: [ "main" ]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ephemeral-cd:
        runs-on: ubuntu-latest

        # IDs injection for Azure et Docker Hub login
        env:
            ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  
            ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

        steps:
            - name : Check out infrastructure code
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.8.0
                terraform_wrapper: false

            - name: Terraform Init
              run: terraform init

            - name: Terraform Apply
              run: terraform apply -auto-approve

            - name: Smoke test (check health endpoint)
              
              run: |
                # URL retrieval from terraform outputs
                APP_URL=$(terraform output -raw web_app_url)
                echo "Testing ${APP_URL}/health"

                # Test loop, tries each 5 sec 20 times
                for i in {1..12}; do
                    if curl -s -f "${APP_URL}/health" | grep -q "UP"; then
                        echo "Smoke test passed !"
                        exit 0
                    fi
                    echo "Waiting for app startup ($i/12 tries)..."
                    sleep 5
                done

                echo "Test failed : Timed out."
                exit 1

            - name: Terraform Destroy
              # Destroy even if test failed
              if: always() 
              run: terraform destroy -auto-approve